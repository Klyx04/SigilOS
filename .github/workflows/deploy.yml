name: Build & Push Images

# ─────────────────────────────────────────────────────────────
# CI/CD : build les images Docker sur GitHub (pas sur le VPS !)
# - branche dev  -> images BETA  (sigilos-*-beta)
# - branche main -> images PROD  (sigilos-*-prod)
# Les images sont poussées vers GHCR (GitHub Container Registry)
# taggées par SHA git + latest. Le VPS n'a plus qu'à pull + up.
# Déploiement ~30s au lieu de ~5min (build fait 1× sur GitHub).
#
# Prérequis :
#  - Secrets GitHub : GHCR_PAT (Personal Access Token avec
#    write:packages) ou utiliser GITHUB_TOKEN (défaut).
#  - Secrets du build : BETA_PASSWORD, NEXT_PUBLIC_APP_URL
#    (définis dans Settings > Secrets and variables > Actions).
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - dev
      - main

# Le workflow de build ne doit pas dupliquer avec verify.yml :
# il ne se lance QUE quand des fichiers sources changent.
permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: 🏗️ Build & Push (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      BRANCH: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ───────────────────────────────────────────────────
      # Déterminer le suffixe (beta/prod) selon la branche
      # ───────────────────────────────────────────────────
      - name: Set environment suffix
        id: env
        run: |
          if [ "${{ env.BRANCH }}" == "main" ]; then
            echo "suffix=prod" >> $GITHUB_OUTPUT
            echo "app_url=https://sigilos.fr" >> $GITHUB_OUTPUT
          else
            echo "suffix=beta" >> $GITHUB_OUTPUT
            echo "app_url=https://beta.sigilos.fr" >> $GITHUB_OUTPUT
          fi
          # GHCR impose des noms de repo en minuscules
          echo "owner_lower=${IMAGE_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ───────────────────────────────────────────────────
      # Cache de dépendances npm (réutilise npm ci)
      # ───────────────────────────────────────────────────
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      # ───────────────────────────────────────────────────
      # Build + Push des 4 images (app, worker, ws, discord-bot)
      # Le Dockerfile est SHARÉ entre app/worker/ws → BuildKit
      # met en cache les couches communes (le gros build Next.js
      # n'est fait qu'UNE fois par run grâce aux couches partagées).
      # ───────────────────────────────────────────────────
      - name: Build & Push images
        run: |
          SUFFIX=${{ steps.env.outputs.suffix }}
          APP_URL=${{ steps.env.outputs.app_url }}
          SHA_SHORT=${SHA:0:7}
          REG="ghcr.io/${{ steps.env.outputs.owner_lower }}"

          for NAME in app worker ws; do
            echo "▶️  Building sigilos-${NAME}-${SUFFIX}..."
            docker buildx build --push \
              -f Dockerfile \
              --build-arg NEXT_PUBLIC_APP_URL="${APP_URL}" \
              --build-arg BETA_PASSWORD="${{ secrets.BETA_PASSWORD }}" \
              --target runner \
              -t "${REG}/sigilos-${NAME}-${SUFFIX}:${SHA_SHORT}" \
              -t "${REG}/sigilos-${NAME}-${SUFFIX}:latest" \
              --cache-from "type=registry,ref=${REG}/sigilos-${NAME}-${SUFFIX}:latest" \
              --cache-to "type=registry,ref=${REG}/sigilos-${NAME}-${SUFFIX}:cache,mode=max" \
              .
          done

          echo "▶️  Building sigilos-discord-bot-${SUFFIX}..."
          docker buildx build --push \
            -f services/discord-bot/Dockerfile \
            -t "${REG}/sigilos-discord-bot-${SUFFIX}:${SHA_SHORT}" \
            -t "${REG}/sigilos-discord-bot-${SUFFIX}:latest" \
            --cache-from "type=registry,ref=${REG}/sigilos-discord-bot-${SUFFIX}:latest" \
            --cache-to "type=registry,ref=${REG}/sigilos-discord-bot-${SUFFIX}:cache,mode=max" \
            .

      # ───────────────────────────────────────────────────
      # ⚠️ Note sur le déploiement :
      # Le VPS exécute ensuite : ./scripts/deploy-cd.sh beta <sha>
      # Il pull les images GHCR et fait up -d (aucun build local).
      # ───────────────────────────────────────────────────