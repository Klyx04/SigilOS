name: SigilOS CI

# ─────────────────────────────────────────────────────────────
# TRIGGERS
# - Push: only main/dev (protected branches)
# - PR: main/dev (feature branches get CI via PR only)
# - Schedule: weekly security scan (Monday 3am UTC)
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
      - '.gemini/**'
      - '.agent/**'
      - '.antigravity'
      - 'scripts/*.sh'
      - 'scripts/*.md'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
      - '.gemini/**'
      - '.agent/**'
      - '.antigravity'
      - 'scripts/*.sh'
      - 'scripts/*.md'
  schedule:
    # Weekly security scan — Monday 3:00 AM UTC
    - cron: '0 3 * * 1'

# Cancel previous runs on the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# ─────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────
jobs:

  # ┌──────────────────────────────────────────────────────────┐
  # │ ✅ VERIFY & BUILD — Single job to save CI minutes        │
  # │ Lint, Types, Tests + conditional Production Build        │
  # └──────────────────────────────────────────────────────────┘
  verify:
    name: ✅ Verify & Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Next.js Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 💎 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=critical

      - name: 🧹 Lint Check
        run: npm run lint

      - name: 🧪 TypeScript Check
        run: npx tsc --noEmit

      - name: 🚀 Run Tests
        run: npm run test:run

      # Build only on PRs and protected branches (not every push)
      - name: 🏗️ Production Build
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: npm run build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"

  # ┌──────────────────────────────────────────────────────────┐
  # │ 🔐 SECURITY — Weekly deep scan (Gitleaks)               │
  # │ Runs on schedule only to save CI minutes                 │
  # └──────────────────────────────────────────────────────────┘
  security-scan:
    name: 🔐 Weekly Security Scan
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 🛡️ Full Security Audit
        run: npm audit --audit-level=high
