name: SigilOS CI

# ─────────────────────────────────────────────────────────────
# TRIGGERS: Push on main/dev/feat/fix branches + PRs to main/dev
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, dev, "feat/*", "fix/*", "chore/*" ]
  pull_request:
    branches: [ main, dev ]

# Cancel previous runs on the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# ─────────────────────────────────────────────────────────────
# JOBS: Run in parallel for fast feedback
# ─────────────────────────────────────────────────────────────
jobs:

  # ┌──────────────────────────────────────────────────────────┐
  # │ 🔐 SECURITY — Secrets & Vulnerabilities                  │
  # └──────────────────────────────────────────────────────────┘
  security:
    name: 🔐 Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for Gitleaks

      - name: 🔐 Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=critical

  # ┌──────────────────────────────────────────────────────────┐
  # │ 🧹 QUALITY — Lint & TypeScript                           │
  # └──────────────────────────────────────────────────────────┘
  quality:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 💎 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"

      - name: 🧹 Lint Check
        run: npm run lint

      - name: 🧪 TypeScript Check
        run: npx tsc --noEmit

  # ┌──────────────────────────────────────────────────────────┐
  # │ 🏗️ BUILD — Production Build Verification                 │
  # └──────────────────────────────────────────────────────────┘
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 💎 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"

      - name: 🏗️ Production Build
        run: npm run build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'dummy_secret_for_ci_verification' }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"

  # ┌──────────────────────────────────────────────────────────┐
  # │ 🚀 TESTS — Vitest                                        │
  # └──────────────────────────────────────────────────────────┘
  tests:
    name: 🚀 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 💎 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"

      - name: 🚀 Run Tests
        run: npm run test:run
