name: SigilOS CI

# ─────────────────────────────────────────────────────────────
# TRIGGERS
# - Push: only main/dev (protected branches)
# - PR: main/dev (feature branches get CI via PR only)
# - Schedule: weekly security scan (Monday 3am UTC)
# NOTE: paths-ignore removed — using a filter job instead so
#       the required check is always reported (never stuck in
#       "Expected" state when only doc/config files change).
# NOTE (F2, 20/09/2026): toute action — y compris first-party
#       (`actions/*`) — est épinglée sur un SHA de commit complet,
#       tag rappelé en commentaire (`@<sha40> # vX`, forme suivie par
#       Dependabot). Garde automatique : tests/unit/workflows-actions-pinned.test.ts
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Weekly security scan — Monday 3:00 AM UTC
    - cron: '0 3 * * 1'

# Cancel previous runs on the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# ─────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────
jobs:

  # ┌──────────────────────────────────────────────────────────┐
  # │ 🔍 FILTER — Detect if any non-doc file changed          │
  # │ Prevents the required check from being stuck in         │
  # │ "Expected" state when only docs/config files changed.   │
  # └──────────────────────────────────────────────────────────┘
  filter:
    name: 🔍 Filter changed files
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      should_run: ${{ steps.changes.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            src:
              - '!**.md'
              - '!.gitignore'
              - '!LICENSE'
              - '!docs/**'
              - '!.gemini/**'
              - '!scripts/*.sh'
              - '!scripts/*.md'
              - '**'

  # ┌──────────────────────────────────────────────────────────┐
  # │ ✅ VERIFY & BUILD — Single job to save CI minutes        │
  # │ Lint, Types, Tests + conditional Production Build        │
  # └──────────────────────────────────────────────────────────┘
  verify:
    name: ✅ Verify & Build
    needs: filter
    if: github.event_name != 'schedule' && needs.filter.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Plafond mémoire : `npx tsc --noEmit` et `next build` (phase « Running TypeScript »,
    # type-check complet + client Prisma) atteignent ~2 Go → OOM avec le heap Node par
    # défaut (~2 Go). 4 Go sur un runner 16 Go = marge confortable.
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: 🚫 Sources silencieusement ignorées
        run: |
          # Un fichier SOURCE ignoré par `.gitignore` n'existe PAS dans le repo :
          # le CI casse alors en « Cannot find module » pendant que le poste local
          # compile très bien (incident du 18/09/2026 : `src/app/god/logs/market-log-view.tsx`
          # avalé par la règle `logs/`, devenue `/logs/`). Dossiers d'audit/temp
          # volontairement ignorés = allowlist ci-dessous.
          ALLOWED_RE='^(src/audit-cyber|src/audit-infra|src/temp)(/|$)'
          OFFENDERS=$(git status --porcelain --ignored | sed -n 's/^!! //p' | grep '^src/' | grep -Ev "$ALLOWED_RE" || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Fichier(s) source ignoré(s) par .gitignore : $OFFENDERS"
            exit 1
          fi
          echo "✅ Aucun fichier source ignoré"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🖼️ Médias suivis sans métadonnées (EXIF/XMP)
        # Un export d'éditeur embarque « Adobe Photoshop 26.5 (Windows) » + horodatage,
        # une capture d'écran embarque le nom du poste ou un dossier local : dans un
        # dépôt PUBLIC c'est une empreinte de la machine. Contrôle zéro-dépendance
        # (aucun `npm ci` requis) — cf. docs/RULES.md §Sécurité de la chaîne d'outils.
        run: node scripts/check-media-metadata.mjs

      - name: Update npm (bulk advisory endpoint)
        run: npm install -g npm@11 --force

      - name: Next.js Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: 🔒 Lockfile Integrity Check
        run: |
          # Verify lockfile wasn't tampered — npm ci should not modify it
          if [ -n "$(git diff --name-only package-lock.json)" ]; then
            echo "::error::package-lock.json was modified by npm ci — possible supply chain tampering!"
            git diff package-lock.json
            exit 1
          fi
          echo "✅ Lockfile integrity verified"

      - name: 🪱 Shai-Hulud IOC Scan
        # Détecte les implants du ver Shai-Hulud (keyv/cacheable, 2026-08) :
        # Math_Symbol.js / math_init.js, hook preinstall "node setup.mjs" + signature execFileSync/bun.
        # Logique 3 niveaux (combinaison de signatures) → zéro faux positif sur notre install saine.
        run: bash scripts/check-ioc-shai-hulud.sh

      - name: 💎 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"

      - name: 🛡️ Security Audit
        run: |
          # Endpoint bulk deprecated parfois en 503 transitoire → retry avec backoff.
          # (Un vrai finding high/critical reste un échec, on n'ignore pas la sécurité.)
          _attempt=0
          until npm audit --audit-level=high; do
            _attempt=$((_attempt+1))
            echo "::warning::npm audit failed (attempt $_attempt/5) — retrying in 15s"
            [ "$_attempt" -ge 5 ] && exit 1
            sleep 15
          done

      - name: 🔬 SAST Scan (Semgrep)
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/security-audit
        env:
          SEMGREP_RULES: p/security-audit

      - name: 🐋 Dockerfile Config Scan (Trivy)
        # F-22: pinned to a real tagged release (v0.36.0 exists) — @master could execute compromised code
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          hide-progress: true
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          format: 'table'

      - name: 🧹 Lint Check
        run: npm run lint

      - name: 🧪 TypeScript Check
        run: npx tsc --noEmit

      - name: 🤖 Discord Bot TypeScript Check
        # Le bot a son propre tsconfig + node_modules (non couvert par le tsc
        # racine) : sans ce contrôle, une erreur de syntaxe passe la CI verte
        # puis casse le build Docker (vécu : handler GuildCreate fusionné avec
        # un commentaire → image bot KO, 3 retries inutiles).
        # Miroir du Dockerfile (generate avec URL factice, pas de connexion).
        run: |
          cd services/discord-bot
          npm ci
          POSTGRES_USER=build POSTGRES_PASSWORD=build POSTGRES_DB=build npx prisma@7.9.1 generate --schema ../../prisma/schema.prisma
          npx tsc --noEmit

      - name: 🚀 Run Tests
        run: npm run test:run

      # Build ONLY on pull_request (economy + coverage).
      # - Sur push main/dev : le build de prod est DEJA garanti par deploy.yml
      #   (docker buildx -> npm run build dans le Dockerfile l.41-46). Le refaire
      #   ici = double build inutile (2x minutes Actions gratuites).
      # - Sur PR : on garde la garantie "le build passe avant merge".
      # SECURITY FIX (F-18): jamais d'AUTH_SECRET sur un runner pull_request —
      # un PR malveillant pourrait l'exfiltrer via la sortie du build.
      # Pre-requis valide : `npm run build` passe SANS AUTH_SECRET (testé 2026-08-05).
      - name: 🏗️ Production Build
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"

  # ┌──────────────────────────────────────────────────────────┐
  # │ 🔐 SECURITY — Weekly deep scan (Gitleaks)               │
  # │ Runs on schedule only to save CI minutes                 │
  # └──────────────────────────────────────────────────────────┘
  security-scan:
    name: 🔐 Weekly Security Scan
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (full history for Gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🔐 Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Update npm (bulk advisory endpoint)
        run: npm install -g npm@11 --force

      - name: Install Dependencies
        run: npm ci

      - name: 🔒 Lockfile Integrity Check
        run: |
          if [ -n "$(git diff --name-only package-lock.json)" ]; then
            echo "::error::package-lock.json was modified by npm ci — possible supply chain tampering!"
            git diff package-lock.json
            exit 1
          fi
          echo "✅ Lockfile integrity verified"

      - name: 🪱 Shai-Hulud IOC Scan (weekly deep)
        # Idem job verify — scan complet des IOCs Shai-Hulud à chaque scan hebdo.
        run: bash scripts/check-ioc-shai-hulud.sh

      - name: 🛡️ Full Security Audit
        run: |
          # Endpoint bulk deprecated parfois en 503 transitoire → retry avec backoff.
          _attempt=0
          until npm audit --audit-level=high; do
            _attempt=$((_attempt+1))
            echo "::warning::npm audit failed (attempt $_attempt/5) — retrying in 15s"
            [ "$_attempt" -ge 5 ] && exit 1
            sleep 15
          done

      - name: 🔎 Deep SAST Scan (Semgrep)
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_RULES: "p/security-audit p/secrets p/owasp-top-ten"

      - name: 🛡️ Full Filesystem CVE Scan (Trivy)
        # F-22: pinned to a real tagged release (v0.36.0 exists) — @master could execute compromised code
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          hide-progress: true
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0' # Don't fail the weekly scan, just report
          ignore-unfixed: true
