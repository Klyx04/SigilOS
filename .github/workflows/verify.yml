name: SigilOS CI (Verification)

on:
  push:
    branches: [ main, dev, "feat/*" ]
  pull_request:
    branches: [ main, dev ]

# Required for Gitleaks to access PR commits
permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for Gitleaks to access full git history

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Security Audit (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 🔐 Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💎 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"

      - name: 🧹 Linting Check
        run: npm run lint

      - name: 🧪 Type Checking (TypeScript)
        run: npx tsc --noEmit

      - name: 🏗️ Production Build Check
        run: npm run build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'dummy_secret_for_ci_verification' }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"

      - name: 🚀 Run Tests (Vitest)
        run: npm run test:run
