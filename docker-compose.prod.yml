services:
  # ===========================================================================
  # 🔴 PRODUCTION ENVIRONMENT
  # ===========================================================================
  app-prod:
    container_name: sigilos-prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-prod:5432/${POSTGRES_DB}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://${DOMAIN_NAME}/api/auth
      - AUTH_TRUST_HOST=true
      - NEXT_PUBLIC_APP_URL=https://${DOMAIN_NAME}
      - AUTH_DISCORD_ID=${DISCORD_CLIENT_ID}
      - AUTH_DISCORD_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - METAMOB_API_KEY=${METAMOB_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db-prod
      - redis
    networks:
      - prod-net

  db-prod:
    image: postgres:15-alpine
    container_name: sigilos-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    networks:
      - prod-net

  # ===========================================================================
  # 🟡 BETA ENVIRONMENT
  # ===========================================================================
  app-beta:
    container_name: sigilos-beta
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-beta:5432/${POSTGRES_DB}
      - AUTH_SECRET=${AUTH_SECRET_BETA:-${AUTH_SECRET}}
      - AUTH_URL=https://beta.${DOMAIN_NAME}/api/auth
      - AUTH_TRUST_HOST=true
      - NEXT_PUBLIC_APP_URL=https://beta.${DOMAIN_NAME}
      - AUTH_DISCORD_ID=${DISCORD_CLIENT_ID}
      - AUTH_DISCORD_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - METAMOB_API_KEY=${METAMOB_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db-beta
      - redis
    networks:
      - beta-net

  db-beta:
    image: postgres:15-alpine
    container_name: sigilos-db-beta
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-beta-data:/var/lib/postgresql/data
    networks:
      - beta-net

  # ===========================================================================
  # 🌐 ROUTING (Caddy gère le SSL automatique)
  # ===========================================================================
  caddy:
    image: caddy:alpine
    container_name: sigilos-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    networks:
      - prod-net
      - beta-net

  # ===========================================================================
  # 🧠 QUEUE SERVICE (Indispensable pour l'app même sans IA)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: sigilos-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - prod-net
      - beta-net

volumes:
  db-prod-data:
  db-beta-data:
  caddy_data:
  caddy_config:
  redis_data:


networks:
  prod-net:
  beta-net:
