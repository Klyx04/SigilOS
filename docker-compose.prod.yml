services:
  # ===========================================================================
  # 🔴 PRODUCTION ENVIRONMENT
  # ===========================================================================
  app-prod:
    container_name: sigilos-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BETA_PASSWORD=${NEXT_PUBLIC_BETA_PASSWORD}
    restart: always
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
    depends_on:
      - db-prod
      - redis
    networks:
      - prod-net

  db-prod:
    image: postgres:15-alpine
    container_name: sigilos-db-prod
    restart: always
    env_file: .env.prod
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    networks:
      - prod-net

  # ===========================================================================
  # 🟡 BETA ENVIRONMENT
  # ===========================================================================
  app-beta:
    container_name: sigilos-beta
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BETA_PASSWORD=${NEXT_PUBLIC_BETA_PASSWORD}
    restart: always
    env_file: .env.beta
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
    depends_on:
      - db-beta
      - redis
    networks:
      - beta-net

  db-beta:
    image: postgres:15-alpine
    container_name: sigilos-db-beta
    restart: always
    env_file: .env.beta
    volumes:
      - db-beta-data:/var/lib/postgresql/data
    networks:
      - beta-net

  # ===========================================================================
  # 🌐 ROUTING
  # ===========================================================================
  caddy:
    image: caddy:alpine
    container_name: sigilos-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env.prod
    networks:
      - prod-net
      - beta-net

  # ===========================================================================
  # 🧠 QUEUE SERVICE (Redis)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: sigilos-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - prod-net
      - beta-net

  # ===========================================================================
  # 📊 MONITORING STACK
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: sigilos-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - prod-net
      - beta-net

  grafana:
    image: grafana/grafana:latest
    container_name: sigilos-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://monitor.sigilos.fr
      # 🛡️ GitHub OAUTH2
      - GF_AUTH_GITHUB_ENABLED=true
      - GF_AUTH_GITHUB_ALLOW_SIGN_UP=true
      - GF_AUTH_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GF_AUTH_GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GF_AUTH_GITHUB_ALLOWED_USERS=Klyx04
      - GF_AUTH_GITHUB_SCOPES=user:email,read:org
      - GF_AUTH_GITHUB_AUTH_URL=https://github.com/login/oauth/authorize
      - GF_AUTH_GITHUB_TOKEN_URL=https://github.com/login/oauth/access_token
      - GF_AUTH_GITHUB_API_URL=https://api.github.com/user
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - prod-net
      - beta-net

volumes:
  db-prod-data:
  db-beta-data:
  caddy_data:
  caddy_config:
  redis_data:
  prometheus_data:
  grafana_data:


networks:
  prod-net:
  beta-net:
