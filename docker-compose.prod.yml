services:
  # ===========================================================================
  # 🔴 PRODUCTION ENVIRONMENT
  # ===========================================================================
  app-prod:
    container_name: sigilos-prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - AUTH_DISCORD_ID=${DISCORD_CLIENT_ID}
      - AUTH_DISCORD_SECRET=${DISCORD_CLIENT_SECRET}
      - AUTH_TRUST_HOST=true
    depends_on:
      - db-prod
      - redis
    networks:
      - prod-net

  db-prod:
    image: postgres:15-alpine
    container_name: sigilos-db-prod
    restart: always
    env_file: .env.prod
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    networks:
      - prod-net

  # ===========================================================================
  # 🟡 BETA ENVIRONMENT
  # ===========================================================================
  app-beta:
    container_name: sigilos-beta
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env.beta
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - AUTH_URL=https://beta.sigilos.fr
      - NEXT_PUBLIC_APP_URL=https://beta.sigilos.fr
      - AUTH_DISCORD_ID=${DISCORD_CLIENT_ID}
      - AUTH_DISCORD_SECRET=${DISCORD_CLIENT_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=${AUTH_SECRET_BETA:-${AUTH_SECRET}}
    depends_on:
      - db-beta
      - redis
    networks:
      - beta-net

  db-beta:
    image: postgres:15-alpine
    container_name: sigilos-db-beta
    restart: always
    env_file: .env.beta
    volumes:
      - db-beta-data:/var/lib/postgresql/data
    networks:
      - beta-net

  # ===========================================================================
  # 🌐 ROUTING
  # ===========================================================================
  caddy:
    image: caddy:alpine
    container_name: sigilos-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - BETA_PASSWORD_HASH=${BETA_PASSWORD_HASH}
    networks:
      - prod-net
      - beta-net

  # ===========================================================================
  # 🧠 QUEUE SERVICE
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: sigilos-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - prod-net
      - beta-net

volumes:
  db-prod-data:
  db-beta-data:
  caddy_data:
  caddy_config:
  redis_data:


networks:
  prod-net:
  beta-net:
