# ===========================================================================
# ⚓ COMMON CONFIGURATION
# ===========================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ===========================================================================
  # 🔴 PRODUCTION ENVIRONMENT
  # ===========================================================================
  app-prod:
    container_name: sigilos-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BETA_PASSWORD=${NEXT_PUBLIC_BETA_PASSWORD:-}
    restart: always
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
    depends_on:
      - db-prod
      - redis
    networks:
      - prod-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    volumes:
      - uploads-prod-data:/app/public/uploads # ✅ Persist uploaded images
    logging: *default-logging

  db-prod:
    image: postgres:15-alpine
    container_name: sigilos-db-prod
    restart: always
    env_file: .env.prod
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    networks:
      - prod-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  discord-bot-prod:
    container_name: sigilos-discord-bot-prod
    build:
      context: .
      dockerfile: services/discord-bot/Dockerfile
    restart: always
    env_file: .env.prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-prod:5432/${POSTGRES_DB}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    depends_on:
      - db-prod
    networks:
      - prod-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    logging: *default-logging

  # ===========================================================================
  # 🟡 BETA ENVIRONMENT
  # ===========================================================================
  app-beta:
    container_name: sigilos-beta
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BETA_PASSWORD=${NEXT_PUBLIC_BETA_PASSWORD:-}
    restart: always
    env_file: .env.beta
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
    depends_on:
      - db-beta
      - redis
    networks:
      - beta-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    volumes:
      - uploads-beta-data:/app/public/uploads # ✅ Persist uploaded images
    logging: *default-logging

  db-beta:
    image: postgres:15-alpine
    container_name: sigilos-db-beta
    restart: always
    env_file: .env.beta
    volumes:
      - db-beta-data:/var/lib/postgresql/data
    networks:
      - beta-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  discord-bot-beta:
    container_name: sigilos-discord-bot-beta
    build:
      context: .
      dockerfile: services/discord-bot/Dockerfile
    restart: always
    env_file: .env.beta
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-beta:5432/${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=db-beta
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    depends_on:
      - db-beta
    networks:
      - beta-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    logging: *default-logging

  # ===========================================================================
  # 🌐 ROUTING
  # ===========================================================================
  caddy:
    image: caddy:alpine
    container_name: sigilos-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      # Uploads are served by Next.js API route — no Caddy volume needed
    env_file: .env.prod
    networks:
      - prod-net
      - beta-net
    logging: *default-logging

  # ===========================================================================
  # 🧠 QUEUE SERVICE (Redis)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: sigilos-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - prod-net
      - beta-net
    logging: *default-logging

  # ===========================================================================
  # 📊 MONITORING STACK
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: sigilos-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - prod-net
      - beta-net
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: sigilos-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://monitor.sigilos.fr
      # 🛡️ GitHub OAUTH2
      - GF_AUTH_GITHUB_ENABLED=true
      - GF_AUTH_GITHUB_ALLOW_SIGN_UP=true
      - GF_AUTH_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GF_AUTH_GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GF_AUTH_GITHUB_ALLOWED_USERS=Klyx04
      - GF_AUTH_GITHUB_SCOPES=user:email,read:org
      - GF_AUTH_GITHUB_AUTH_URL=https://github.com/login/oauth/authorize
      - GF_AUTH_GITHUB_TOKEN_URL=https://github.com/login/oauth/access_token
      - GF_AUTH_GITHUB_API_URL=https://api.github.com/user
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - prod-net
      - beta-net
    logging: *default-logging

  # ===========================================================================
  # 📊 NODE EXPORTER (Server CPU/RAM/Disk)
  # ===========================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: sigilos-node-exporter
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - prod-net
    logging: *default-logging

  # ===========================================================================
  # 📊 CADVISOR (Docker Container Metrics)
  # ===========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sigilos-cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - prod-net
      - beta-net
    logging: *default-logging

  # ===========================================================================
  # 📊 POSTGRES EXPORTER (Database Metrics)
  # ===========================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sigilos-postgres-exporter
    restart: always
    env_file: .env.prod
    environment:
      DATA_SOURCE_NAME: "host=db-prod port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} database=${POSTGRES_DB} sslmode=disable"
    depends_on:
      - db-prod
    networks:
      - prod-net
    logging: *default-logging
  # ===========================================================================
  # 🧠 AI SERVICE - REMOVED (Now using Gemini API)
  # ===========================================================================
  # Ollama was removed - using Google Gemini 1.5 Flash API instead
  # This saves ~6GB RAM and eliminates timeout issues

volumes:
  db-prod-data:
  db-beta-data:
  caddy_data:
  caddy_config:
  redis_data:
  prometheus_data:
  grafana_data:
  uploads-prod-data: # ✅ Production uploads isolated
  uploads-beta-data:
    # ✅ Beta uploads isolated

networks:
  prod-net:
  beta-net:
