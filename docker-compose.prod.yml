# ===========================================================================
# ⚓ COMMON CONFIGURATION
# ===========================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# ===========================================================================
# 💓 HEALTHCHECKS SHARED (used by deploy.sh --wait)
# ===========================================================================
x-healthchecks:
  app-healthcheck: &app-healthcheck
    test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s
  worker-healthcheck: &worker-healthcheck
    test: ["CMD-SHELL", "pgrep -f 'worker.js' || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  ws-healthcheck: &ws-healthcheck
    test: ["CMD-SHELL", "pgrep -f 'ws-server.js' || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  db-healthcheck: &db-healthcheck
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s
  bot-healthcheck: &bot-healthcheck
    test: ["CMD-SHELL", "pgrep -f 'discord' || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  # ===========================================================================
  # 🔴 PRODUCTION ENVIRONMENT
  # ===========================================================================
  app-prod:
    container_name: sigilos-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BETA_PASSWORD=${BETA_PASSWORD:-}
        - NEXT_PUBLIC_APP_URL=https://sigilos.fr
    restart: always
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
    depends_on:
      - db-prod
      - redis
    networks:
      - prod-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    volumes:
      - uploads-prod-data:/app/private_uploads # ✅ Persist private uploads
      - /home/sigiladmin/SigilOS/public/game-data:/app/public/game-data # ✅ Game assets (bind mount — updated by sync-assets.sh)
    logging: *default-logging
    healthcheck: *app-healthcheck

  worker-prod:
    container_name: sigilos-worker-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BETA_PASSWORD=${BETA_PASSWORD:-}
        - NEXT_PUBLIC_APP_URL=https://sigilos.fr
    restart: always
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
    command: [ "node", "./worker.js" ]
    depends_on:
      - db-prod
      - redis
    networks:
      - prod-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging
    healthcheck: *worker-healthcheck

  ws-prod:
    container_name: sigilos-ws-prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env.prod
    environment:
      - NODE_ENV=production
    command: [ "npm", "run", "start:ws" ]
    depends_on:
      - redis
    networks:
      - prod-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging
    healthcheck: *ws-healthcheck

  db-prod:
    image: postgres:15-alpine
    container_name: sigilos-db-prod
    restart: always
    env_file: .env.prod
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    networks:
      - prod-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging
    healthcheck: *db-healthcheck

  discord-bot-prod:
    container_name: sigilos-discord-bot-prod
    build:
      context: .
      dockerfile: services/discord-bot/Dockerfile
    restart: always
    env_file: .env.prod
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    depends_on:
      - db-prod
    networks:
      - prod-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    logging: *default-logging
    healthcheck: *bot-healthcheck

  # ===========================================================================
  # 🟡 BETA ENVIRONMENT
  # ===========================================================================
  app-beta:
    container_name: sigilos-beta
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BETA_PASSWORD=${BETA_PASSWORD:-}
        - NEXT_PUBLIC_APP_URL=https://beta.sigilos.fr
    restart: always
    env_file: .env.beta
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
    depends_on:
      - db-beta
      - redis-beta
    networks:
      - beta-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    volumes:
      - uploads-beta-data:/app/private_uploads # ✅ Persist private uploads
      - /home/sigiladmin/SigilOS/public/game-data:/app/public/game-data # ✅ Game assets (bind mount — updated by sync-assets.sh)
    logging: *default-logging
    healthcheck: *app-healthcheck

  worker-beta:
    container_name: sigilos-worker-beta
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BETA_PASSWORD=${BETA_PASSWORD:-}
        - NEXT_PUBLIC_APP_URL=https://beta.sigilos.fr
    restart: always
    env_file: .env.beta
    environment:
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
    command: [ "node", "./worker.js" ]
    depends_on:
      - db-beta
      - redis-beta
    networks:
      - beta-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging
    healthcheck: *worker-healthcheck

  ws-beta:
    container_name: sigilos-ws-beta
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env.beta
    environment:
      - NODE_ENV=production
    command: [ "npm", "run", "start:ws" ]
    depends_on:
      - redis-beta
    networks:
      - beta-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging
    healthcheck: *ws-healthcheck

  db-beta:
    image: postgres:15-alpine
    container_name: sigilos-db-beta
    restart: always
    env_file: .env.beta
    volumes:
      - db-beta-data:/var/lib/postgresql/data
    networks:
      - beta-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging
    healthcheck: *db-healthcheck

  discord-bot-beta:
    container_name: sigilos-discord-bot-beta
    build:
      context: .
      dockerfile: services/discord-bot/Dockerfile
    restart: always
    env_file: .env.beta
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    depends_on:
      - db-beta
    networks:
      - beta-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    logging: *default-logging
    healthcheck: *bot-healthcheck

  # ===========================================================================
  # 🌐 ROUTING
  # ===========================================================================
  caddy:
    # SECURITY (F-14): image custom via xcaddy pour le module rate-limit
    # (caddy:alpine officiel ne contient pas le plugin). Build sur le VPS.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: sigilos-caddy:latest
    container_name: sigilos-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./public/maintenance.html:/srv/static/maintenance.html:ro # 🔴 Prod maintenance page
      - ./public/maintenance-beta.html:/srv/static/maintenance-beta.html:ro # 🟡 Beta maintenance page
      - ./public/429.html:/srv/static/429.html:ro # 🌀 Page 429 personnalisée (rate-limit — filet anti-abus)
      - ./public/game-data:/srv/game-data:ro # 🗺️ Game assets (tuiles/maps) servis en statique par Caddy — mise à jour via sync-assets.sh
      # Uploads are served by Next.js API route — no Caddy volume needed
    env_file: .env.prod
    networks:
      - prod-net
      - beta-net
    logging: *default-logging

  # ===========================================================================
  # 🧠 QUEUE SERVICE (Redis)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: sigilos-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - prod-net
    logging: *default-logging

  # ===========================================================================
  # 🟡 REDIS BETA — isolé de la prod (I-07 : anti SPOF, anti collision de clés/jobs)
  # ===========================================================================
  redis-beta:
    image: redis:7-alpine
    container_name: sigilos-redis-beta
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD_BETA}
    volumes:
      - redis-beta-data:/data
    networks:
      - beta-net
    logging: *default-logging

  # ===========================================================================
  # 📊 MONITORING STACK
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: sigilos-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d' # 👈 Limite l'utilisation du disque
      - '--storage.tsdb.retention.size=5GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M # 👈 Évite qu'il ne sature la RAM du VPS
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - prod-net
      - beta-net
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: sigilos-grafana
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://monitor.sigilos.fr
      # 🛡️ GitHub OAUTH2
      - GF_AUTH_GITHUB_ENABLED=true
      - GF_AUTH_GITHUB_ALLOW_SIGN_UP=true
      - GF_AUTH_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GF_AUTH_GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GF_AUTH_GITHUB_ALLOWED_USERS=Klyx04
      - GF_AUTH_GITHUB_SCOPES=user:email,read:org
      - GF_AUTH_GITHUB_AUTH_URL=https://github.com/login/oauth/authorize
      - GF_AUTH_GITHUB_TOKEN_URL=https://github.com/login/oauth/access_token
      - GF_AUTH_GITHUB_API_URL=https://api.github.com/user
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - prod-net
      - beta-net
    logging: *default-logging

  # ===========================================================================
  # 📊 NODE EXPORTER (Server CPU/RAM/Disk)
  # ===========================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: sigilos-node-exporter
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - prod-net
    logging: *default-logging

  # ===========================================================================
  # 📊 CADVISOR (Docker Container Metrics)
  # ===========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sigilos-cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - prod-net
      - beta-net
    logging: *default-logging

  # ===========================================================================
  # 📊 POSTGRES EXPORTER (Database Metrics)
  # ===========================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sigilos-postgres-exporter
    restart: always
    env_file: .env.prod
    environment:
      DATA_SOURCE_NAME: "host=db-prod port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} database=${POSTGRES_DB} sslmode=disable"
    depends_on:
      - db-prod
    networks:
      - prod-net
    logging: *default-logging
  # ===========================================================================
  # 🧠 AI SERVICE - REMOVED (Now using Gemini API)
  # ===========================================================================
  # Ollama was removed - using Google Gemini 1.5 Flash API instead
  # This saves ~6GB RAM and eliminates timeout issues

volumes:
  db-prod-data:
  db-beta-data:
  caddy_data:
  caddy_config:
  redis_data:
  redis-beta-data:
  prometheus_data:
  grafana_data:
  uploads-prod-data: # ✅ Production uploads isolated
  uploads-beta-data:
    # ✅ Beta uploads isolated

networks:
  prod-net:
  beta-net: