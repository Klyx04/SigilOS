version: '3.8'

services:
  # -----------------------------------------------------------------------------
  # APPLICATION (Next.js)
  # -----------------------------------------------------------------------------
  app:
    container_name: sigilos-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      # Database connection string (internal docker network alias 'db')
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Auth & App secrets
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://${DOMAIN_NAME}
      - NEXT_PUBLIC_APP_URL=https://${DOMAIN_NAME}
      # Discord
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Redis (internal docker network)
      - REDIS_URL=redis://:${REDIS_PASSWORD:-sigilos-redis-secret}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-sigilos-redis-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Metamob
      - METAMOB_API_KEY=${METAMOB_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal-net
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # HARDWARE LOCKING
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
          # NOTE: 2GB is enough for Next.js + Tesseract.
          # For Qwen2-VL (LLM), DO NOT increase this limit. Create a separate 'ai-worker' service.
          # This protects the web server (= user UX) from the heavy AI workload.
          # LOG HYGIENE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------------
  # DISCORD BOT (Gateway Event Handler)
  # -----------------------------------------------------------------------------
  discord-bot:
    container_name: sigilos-discord-bot
    build:
      context: .
      dockerfile: services/discord-bot/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------------
  # REVERSE PROXY (Caddy - Automatic HTTPS)
  # -----------------------------------------------------------------------------
  caddy:
    image: caddy:alpine
    container_name: sigilos-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC) support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - uploads-data:/app/public/uploads # ✅ Persist uploaded images (missions/achievements)
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    networks:
      - internal-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------------
  # DATABASE (PostgreSQL)
  # -----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: sigilos-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-sigilos}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    # ⚠️ SECURITY: Exposed locally so 'npm run dev' on host can reach it. Production uses docker-compose.prod.yml.
    networks:
      - internal-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-sigilos}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------------
  # REDIS (Cache & Rate Limiting)
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sigilos-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-sigilos-redis-secret}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - internal-net
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sigilos-redis-secret}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------------
  # MONITORING - PROMETHEUS (Metrics Collector)
  # -----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: sigilos-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d' # Keep 15 days of data
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------------
  # MONITORING - NODE EXPORTER (Server CPU/RAM/Disk)
  # -----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: sigilos-node-exporter
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------------
  # MONITORING - CADVISOR (Docker Container Metrics)
  # -----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: sigilos-cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------------
  # MONITORING - POSTGRES EXPORTER (Database Metrics)
  # -----------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sigilos-postgres-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-sigilos}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # -----------------------------------------------------------------------------
  # AI SERVICE - REMOVED (Now using Gemini API)
  # -----------------------------------------------------------------------------
  # Ollama was removed - using Google Gemini 1.5 Flash API instead
  # This saves ~6GB RAM and eliminates timeout issues

volumes:
  db-data:
  redis-data:
  caddy_data:
  caddy_config:
  prometheus-data:
  uploads-data:
    # ✅ New volume for storing user uploads

networks:
  internal-net:
    driver: bridge
