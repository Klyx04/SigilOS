version: '3.8'

services:
  # -----------------------------------------------------------------------------
  # APPLICATION (Next.js)
  # -----------------------------------------------------------------------------
  app:
    container_name: sigilos-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      # Database connection string (internal docker network alias 'db')
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Auth & App secrets
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://${DOMAIN_NAME}
      - NEXT_PUBLIC_APP_URL=https://${DOMAIN_NAME}
      # Discord
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Metamob
      - METAMOB_API_KEY=${METAMOB_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # HARDWARE LOCKING
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
          # NOTE: 2GB is enough for Next.js + Tesseract.
          # For Qwen2-VL (LLM), DO NOT increase this limit. Create a separate 'ai-worker' service.
          # This protects the web server (= user UX) from the heavy AI workload.
          # LOG HYGIENE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------------
  # REVERSE PROXY (Caddy - Automatic HTTPS)
  # -----------------------------------------------------------------------------
  caddy:
    image: caddy:alpine
    container_name: sigilos-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC) support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    networks:
      - internal-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------------
  # DATABASE (PostgreSQL)
  # -----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: sigilos-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-sigilos}
    volumes:
      - db-data:/var/lib/postgresql/data
    # ⚠️ SECURITY: Do not expose port 5432 to the outside world
    # Only services in 'internal-net' can access it.
    networks:
      - internal-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-sigilos}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  caddy_data:
  caddy_config:


networks:
  internal-net:
    driver: bridge
