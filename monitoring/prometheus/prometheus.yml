global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'sigilos-prod'
    static_configs:
      - targets: ['app-prod:3000'] # Nécessite /metrics endpoint dans Next.js (optionnel)

  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:2019'] # Metric Caddy
