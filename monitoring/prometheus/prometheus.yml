# Prometheus Configuration — SigilOS (fichier UNIQUE : dev ET prod)
# Monté par `docker-compose.yml` (dev, port 9090) et `docker-compose.prod.yml` (prod).
# Remplace l'ancien doublon `prometheus/prometheus.yml`, supprimé le 20/09/2026
# (deux copies identiques = risque de divergence silencieuse).
# Cf. docs/arbo/CARTE-DU-PROJET.md §7.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself (self-monitoring)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - Server metrics (CPU, RAM, Disk, Network)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor — SUPPRIMÉ le 13/11/2026 (SEC-04) : plus de socket Docker monté.
  # Les métriques conteneurs ne sont plus collectées.

  # PostgreSQL Exporter - Database metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
