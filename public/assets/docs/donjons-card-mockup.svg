<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Carte d'une sortie Donjons et Quêtes dans SigilOS">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadowCard" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Carte principale -->
  <rect x="20" y="20" width="560" height="480" rx="16" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5" filter="url(#shadowCard)"/>
  <rect x="20" y="20" width="560" height="96" rx="16" fill="url(#emeraldGlow)"/>

  <!-- 1. En-tête : Boss, Niveau, Titre, Statut -->
  <g transform="translate(40, 36)">
    <!-- Boss Icon Box -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
    <image href="/assets/dofus/modules/dofus.png" x="8" y="8" width="40" height="40"/>
    <rect x="2" y="38" width="52" height="16" rx="6" fill="#09090b" opacity="0.85"/>
    <text x="28" y="50" text-anchor="middle" font-size="9" font-weight="800" font-family="monospace" fill="#e4e4e7">LVL 200</text>

    <!-- Titre et sous-titre -->
    <text x="68" y="24" font-size="17" font-weight="700" fill="#ffffff">Capitaine Meno</text>
    <text x="68" y="44" font-size="11" font-weight="600" font-family="monospace" fill="#a1a1aa" letter-spacing="0.5">ABYSSES DE SUFKIA · DONJON</text>

    <!-- Statut Ouvert -->
    <g transform="translate(420, 10)">
      <rect x="0" y="0" width="84" height="26" rx="13" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="16" cy="13" r="3.5" fill="#34d399"/>
      <text x="46" y="17" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#34d399">Ouvert</text>
    </g>
  </g>

  <!-- Ligne séparatrice légère -->
  <line x1="40" y1="108" x2="560" y2="108" stroke="#27272a" stroke-width="1"/>

  <!-- 2. Badges Mode & Places -->
  <g transform="translate(40, 122)">
    <!-- Mode Donjon -->
    <rect x="0" y="0" width="92" height="26" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <image href="/assets/dofus/modules/dofus.png" x="8" y="6" width="14" height="14"/>
    <text x="28" y="17" font-size="11" font-weight="600" font-family="monospace" fill="#e4e4e7">Donjon</text>

    <!-- Places (3 / 4) -->
    <g transform="translate(410, 0)">
      <rect x="0" y="0" width="110" height="26" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="14" y="17" font-size="11" font-weight="600" font-family="monospace" fill="#a1a1aa">👥 3 / 4 <tspan fill="#34d399" font-weight="700">+1</tspan></text>
    </g>
  </g>

  <!-- 3. Date et Heure -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="520" height="30" rx="8" fill="#141519" stroke="#27272a" stroke-width="1"/>
    <image href="/assets/dofus/modules/calendar.png" x="12" y="7" width="16" height="16"/>
    <text x="36" y="19" font-size="11" font-weight="600" font-family="monospace" fill="#d4d4d8">SAMEDI 18 OCTOBRE À 21:00</text>
  </g>

  <!-- 4. Avatars des membres inscrits -->
  <g transform="translate(40, 204)">
    <!-- Joueur 1 (Leader) -->
    <g>
      <circle cx="20" cy="20" r="18" fill="#27272a" stroke="#10b981" stroke-width="2"/>
      <image href="/assets/dofus/classes/9.png" x="4" y="4" width="32" height="32"/>
      <circle cx="32" cy="32" r="7" fill="#09090b" stroke="#27272a"/>
      <text x="32" y="35" text-anchor="middle" font-size="8" fill="#fbbf24">👑</text>
    </g>
    <!-- Joueur 2 -->
    <g transform="translate(44, 0)">
      <circle cx="20" cy="20" r="18" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
      <image href="/assets/dofus/classes/12.png" x="4" y="4" width="32" height="32"/>
    </g>
    <!-- Joueur 3 -->
    <g transform="translate(88, 0)">
      <circle cx="20" cy="20" r="18" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
      <image href="/assets/dofus/classes/7.png" x="4" y="4" width="32" height="32"/>
    </g>
    <!-- Place libre 4 (+) -->
    <g transform="translate(132, 0)">
      <circle cx="20" cy="20" r="18" fill="#064e3b" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="20" y="24" text-anchor="middle" font-size="15" font-weight="700" font-family="monospace" fill="#34d399">+</text>
    </g>
  </g>

  <!-- 5. Succès visés -->
  <g transform="translate(40, 256)">
    <text x="0" y="18" font-size="11" font-weight="600" font-family="monospace" fill="#a1a1aa">Succès :</text>
    <rect x="56" y="4" width="80" height="22" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="96" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#e4e4e7">Premier</text>

    <rect x="144" y="4" width="80" height="22" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="184" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#e4e4e7">Statue</text>
  </g>

  <!-- 6. Liens rapides : Fiche SigilOS, DPLN, DofusDB -->
  <g transform="translate(40, 294)">
    <!-- Fiche SigilOS -->
    <rect x="0" y="0" width="116" height="26" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <image href="/assets/ui/logo-v2.png" x="8" y="6" width="14" height="14"/>
    <text x="28" y="17" font-size="11" font-weight="600" font-family="monospace" fill="#34d399">Fiche SigilOS</text>

    <!-- Guide DPLN -->
    <g transform="translate(124, 0)">
      <rect x="0" y="0" width="98" height="26" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <circle cx="16" cy="13" r="5" fill="#38bdf8"/>
      <text x="28" y="17" font-size="11" font-weight="600" font-family="monospace" fill="#d4d4d8">Guide DPLN</text>
    </g>

    <!-- DofusDB -->
    <g transform="translate(230, 0)">
      <rect x="0" y="0" width="86" height="26" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <circle cx="16" cy="13" r="5" fill="#f59e0b"/>
      <text x="28" y="17" font-size="11" font-weight="600" font-family="monospace" fill="#d4d4d8">DofusDB</text>
    </g>
  </g>

  <!-- 7. Message du meneur (Responsive / break-words) -->
  <g transform="translate(40, 334)">
    <rect x="0" y="0" width="520" height="42" rx="10" fill="#14151a" stroke="#27272a" stroke-width="1"/>
    <text x="14" y="24" font-size="11.5" font-style="italic" fill="#a1a1aa">
      « Passage succès Premier pour la validation du succès Abysses. Stuff opti et vocal appréciés ! »
    </text>
  </g>

  <!-- 8. Footer : Créateur et Bouton Postuler -->
  <g transform="translate(40, 396)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#27272a" stroke-width="1"/>

    <!-- Pseudo meneur -->
    <g transform="translate(0, 16)">
      <circle cx="14" cy="14" r="14" fill="#27272a"/>
      <image href="/assets/dofus/classes/9.png" x="2" y="2" width="24" height="24"/>
      <text x="36" y="18" font-size="12" font-weight="700" fill="#ffffff">Azuria</text>
      <text x="82" y="18" font-size="10" font-weight="600" font-family="monospace" fill="#10b981">LEAD</text>
      <text x="130" y="18" font-size="10" fill="#71717a">il y a 25 min</text>
    </g>

    <!-- Boutons d'action -->
    <g transform="translate(360, 12)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#10b981"/>
      <text x="80" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#022c22">Postuler à la sortie</text>
    </g>
  </g>
</svg>
