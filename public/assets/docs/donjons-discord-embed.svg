<svg xmlns="http://www.w3.org/2000/svg" width="580" height="540" viewBox="0 0 580 540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Exemple de message Discord synchronisé d'une sortie Donjon">
  <rect x="0" y="0" width="580" height="540" rx="12" fill="#313338"/>
  
  <!-- En-tête du message Discord -->
  <g transform="translate(18, 16)">
    <circle cx="20" cy="20" r="20" fill="#10b981"/>
    <image href="/assets/ui/logo-v2.png" x="6" y="6" width="28" height="28"/>
    <text x="52" y="16" font-size="14" font-weight="700" fill="#ffffff">SigilOS</text>
    <rect x="108" y="4" width="34" height="16" rx="4" fill="#5865f2"/>
    <text x="125" y="15" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">BOT</text>
    <text x="150" y="15" font-size="11" fill="#949ba4">Aujourd'hui à 20:45</text>
  </g>

  <!-- Mention de rôle Discord -->
  <g transform="translate(70, 56)">
    <rect x="0" y="0" width="180" height="22" rx="4" fill="#5865f2" fill-opacity="0.25"/>
    <text x="8" y="15" font-size="12" font-weight="600" fill="#c9cdfb">@Donjons &amp; Sorties</text>
  </g>

  <!-- Embed Discord avec barre latérale émeraude -->
  <g transform="translate(70, 88)">
    <rect x="0" y="0" width="490" height="380" rx="6" fill="#2b2d31"/>
    <rect x="0" y="0" width="4" height="380" rx="2" fill="#10b981"/>

    <!-- Titre et Boss Thumbnail -->
    <text x="18" y="28" font-size="15" font-weight="700" fill="#ffffff">🏰 Donjon — Capitaine Meno (Niv. 200)</text>
    <text x="18" y="46" font-size="11" fill="#949ba4">Proposé par Azuria · Abysses de Sufkia</text>
    <rect x="420" y="14" width="54" height="54" rx="8" fill="#1e1f22" stroke="#3f3f46" stroke-width="1"/>
    <image href="/assets/dofus/modules/dofus.png" x="427" y="21" width="40" height="40"/>

    <!-- Grille d'informations : Mode / Leader / Places -->
    <text x="18" y="80" font-size="11" font-weight="700" fill="#ffffff">⚔️ Mode</text>
    <text x="18" y="96" font-size="12" fill="#dbdee1">Donjon 200</text>

    <text x="160" y="80" font-size="11" font-weight="700" fill="#ffffff">👑 Leader</text>
    <text x="160" y="96" font-size="12" font-weight="600" fill="#dbdee1">Azuria</text>

    <text x="300" y="80" font-size="11" font-weight="700" fill="#ffffff">👥 Places</text>
    <text x="300" y="96" font-size="12" font-weight="700" fill="#34d399">3 / 4</text>

    <!-- Date -->
    <text x="18" y="128" font-size="11" font-weight="700" fill="#ffffff">📅 Date et Heure</text>
    <text x="18" y="144" font-size="12" font-weight="600" fill="#dbdee1">Samedi 18 Octobre à 21:00</text>

    <!-- Succès visés -->
    <text x="18" y="176" font-size="11" font-weight="700" fill="#ffffff">🏅 Succès visés</text>
    <text x="18" y="192" font-size="12" fill="#dbdee1">Premier, Statue</text>

    <!-- Message du meneur -->
    <text x="18" y="224" font-size="11" font-weight="700" fill="#ffffff">💬 Message du meneur</text>
    <text x="18" y="240" font-size="11.5" font-style="italic" fill="#949ba4">« Passage succès Premier pour validation quête ocre. »</text>

    <!-- Équipe inscrite -->
    <text x="18" y="274" font-size="11" font-weight="700" fill="#ffffff">✅ Équipe (3)</text>
    <image href="/assets/dofus/classes/9.png" x="18" y="284" width="20" height="20"/>
    <text x="44" y="299" font-size="12" fill="#dbdee1">• Azuria <tspan fill="#949ba4">(Cra - Meneur)</tspan></text>
    <image href="/assets/dofus/classes/12.png" x="18" y="310" width="20" height="20"/>
    <text x="44" y="325" font-size="12" fill="#dbdee1">• Kael <tspan fill="#949ba4">(Pandawa)</tspan></text>
    <image href="/assets/dofus/classes/7.png" x="18" y="336" width="20" height="20"/>
    <text x="44" y="351" font-size="12" fill="#dbdee1">• Sylas <tspan fill="#949ba4">(Eniripsa)</tspan></text>

    <!-- File d'attente -->
    <text x="290" y="274" font-size="11" font-weight="700" fill="#ffffff">⏳ File d'attente (1)</text>
    <text x="290" y="299" font-size="12" fill="#dbdee1">• Varian <tspan fill="#949ba4">(Iop)</tspan></text>
  </g>

  <!-- Boutons d'interaction sous le message -->
  <g transform="translate(70, 480)" font-size="13" font-weight="700">
    <!-- Bouton Postuler -->
    <rect x="0" y="0" width="130" height="38" rx="5" fill="#5865f2"/>
    <text x="65" y="24" text-anchor="middle" fill="#ffffff">📩 Postuler</text>

    <!-- Bouton Quitter -->
    <rect x="142" y="0" width="120" height="38" rx="5" fill="#da373c"/>
    <text x="202" y="24" text-anchor="middle" fill="#ffffff">🚪 Quitter</text>

    <!-- Bouton Lien Fiche SigilOS -->
    <rect x="274" y="0" width="160" height="38" rx="5" fill="#4e5058"/>
    <image href="/assets/ui/logo-v2.png" x="286" y="11" width="16" height="16"/>
    <text x="360" y="24" text-anchor="middle" fill="#ffffff">Fiche SigilOS ↗</text>
  </g>
</svg>
