<svg xmlns="http://www.w3.org/2000/svg" width="560" height="530" viewBox="0 0 560 530" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Exemple de message Discord d'une run Songes">
  <rect x="0" y="0" width="560" height="530" rx="12" fill="#313338"/>
  <!-- En-tête du message -->
  <g>
    <circle cx="36" cy="36" r="20" fill="#5865f2"/>
    <text x="36" y="43" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">S</text>
    <text x="66" y="32" font-size="14" font-weight="bold" fill="#ffffff">SigilOS</text>
    <rect x="124" y="20" width="32" height="15" rx="4" fill="#5865f2"/>
    <text x="140" y="31" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">BOT</text>
    <text x="162" y="31" font-size="11" fill="#949ba4">Aujourd'hui à 21:12</text>
  </g>
  <!-- Mention -->
  <g>
    <rect x="66" y="50" width="168" height="22" rx="5" fill="#5865f2" opacity="0.3"/>
    <text x="76" y="65" font-size="12" font-weight="bold" fill="#c9cdfb">@Membres — Rêve III dispo !</text>
  </g>
  <!-- Embed -->
  <g>
    <rect x="66" y="82" width="478" height="348" rx="6" fill="#2b2d31"/>
    <rect x="66" y="82" width="4" height="348" rx="2" fill="#22c55e"/>
    <text x="84" y="110" font-size="14" font-weight="bold" fill="#ffffff">🌙 Run Songes — Rêve III</text>
    <text x="84" y="128" font-size="11" fill="#949ba4">Proposée par Léa</text>
    <image href="/assets/missions/reve3.png" x="472" y="92" width="56" height="56"/>
    <!-- Ligne 1 : Difficulté / Leader / Places -->
    <text x="84" y="162" font-size="11" font-weight="bold" fill="#ffffff">💀 Difficulté</text>
    <text x="84" y="178" font-size="12" fill="#dbdee1">🟢 Rêve III</text>
    <text x="230" y="162" font-size="11" font-weight="bold" fill="#ffffff">👑 Leader</text>
    <text x="230" y="178" font-size="12" font-weight="bold" fill="#dbdee1">Léa</text>
    <text x="376" y="162" font-size="11" font-weight="bold" fill="#ffffff">👥 Places</text>
    <text x="376" y="178" font-size="12" font-weight="bold" fill="#dbdee1">3/4</text>
    <!-- Date -->
    <text x="84" y="208" font-size="11" font-weight="bold" fill="#ffffff">📅 Date et Heure</text>
    <text x="84" y="224" font-size="12" font-style="italic" fill="#949ba4">Sans date pour l'instant</text>
    <!-- Objectifs -->
    <text x="84" y="254" font-size="11" font-weight="bold" fill="#ffffff">🏅 Objectifs</text>
    <text x="84" y="270" font-size="12" fill="#dbdee1">Mission de Guilde, Quête</text>
    <!-- Équipe -->
    <text x="84" y="300" font-size="11" font-weight="bold" fill="#ffffff">✅ Équipe (3)</text>
    <image href="/assets/dofus/classes/9.png" x="84" y="308" width="22" height="22"/>
    <text x="112" y="324" font-size="12" fill="#dbdee1">• Léa <tspan fill="#949ba4">(Cra)</tspan></text>
    <image href="/assets/dofus/classes/7.png" x="84" y="334" width="22" height="22"/>
    <text x="112" y="350" font-size="12" fill="#dbdee1">• Noah <tspan fill="#949ba4">(Eniripsa)</tspan></text>
    <image href="/assets/dofus/classes/8.png" x="84" y="360" width="22" height="22"/>
    <text x="112" y="376" font-size="12" fill="#dbdee1">• Mia <tspan fill="#949ba4">(Iop)</tspan></text>
    <!-- File d'attente -->
    <text x="330" y="300" font-size="11" font-weight="bold" fill="#ffffff">⏳ File d'attente (1)</text>
    <text x="330" y="324" font-size="12" fill="#dbdee1">• Hugo</text>
    <!-- Footer embed -->
    <text x="84" y="410" font-size="11" fill="#949ba4">Statut : 🟢 Recrutement — Voir la Run sur le dashboard</text>
  </g>
  <!-- Boutons -->
  <g font-size="13" font-weight="bold">
    <rect x="66" y="444" width="130" height="38" rx="5" fill="#5865f2"/>
    <text x="131" y="468" text-anchor="middle" fill="#ffffff">📩 Postuler</text>
    <rect x="204" y="444" width="120" height="38" rx="5" fill="#da373c"/>
    <text x="264" y="468" text-anchor="middle" fill="#ffffff">🚪 Quitter</text>
  </g>
  <text x="66" y="504" font-size="11" fill="#949ba4">Choisir ma classe pour cette run… ▾</text>
</svg>
