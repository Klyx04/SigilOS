<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Les cinq paliers des Songes, étages 1 à 26">
  <rect x="0" y="0" width="760" height="430" rx="12" fill="#15151c"/>
  <text x="24" y="36" font-size="16" font-weight="bold" fill="#ffffff">Progression — étages 1 à 26 puis Combat Final</text>
  <text x="24" y="56" font-size="11" fill="#8b8b98">★ = jalon : fontaine garantie, porte d'entrée du palier</text>
  <g font-size="12">
    <!-- Palier 1 -->
    <image href="/assets/missions/reve1.png" x="24" y="72" width="40" height="40"/>
    <text x="74" y="88" font-size="12" font-weight="bold" fill="#22c55e">Les Pensées oniriques</text>
    <text x="74" y="104" font-size="11" fill="#8b8b98">Palier I</text>
    <g>
      <rect x="240" y="74" width="34" height="34" rx="8" fill="#22c55e" opacity="0.18"/><text x="257" y="97" text-anchor="middle" font-weight="bold" fill="#22c55e">1</text>
      <rect x="280" y="74" width="34" height="34" rx="8" fill="#22c55e" opacity="0.18"/><text x="297" y="97" text-anchor="middle" font-weight="bold" fill="#22c55e">2</text>
      <rect x="320" y="74" width="34" height="34" rx="8" fill="#22c55e" opacity="0.18"/><text x="337" y="97" text-anchor="middle" font-weight="bold" fill="#22c55e">3</text>
    </g>
    <!-- Palier 2 -->
