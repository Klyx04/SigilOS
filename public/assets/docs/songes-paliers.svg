      <rect x="240" y="236" width="34" height="34" rx="8" fill="#f97316" opacity="0.28"/><text x="257" y="259" text-anchor="middle" font-weight="bold" fill="#ffffff">★16</text>
      <rect x="280" y="236" width="34" height="34" rx="8" fill="#f97316" opacity="0.18"/><text x="297" y="259" text-anchor="middle" font-weight="bold" fill="#f97316">17</text>
      <rect x="320" y="236" width="34" height="34" rx="8" fill="#f97316" opacity="0.18"/><text x="337" y="259" text-anchor="middle" font-weight="bold" fill="#f97316">18</text>
      <rect x="360" y="236" width="34" height="34" rx="8" fill="#f97316" opacity="0.18"/><text x="377" y="259" text-anchor="middle" font-weight="bold" fill="#f97316">19</text>
      <rect x="400" y="236" width="34" height="34" rx="8" fill="#f97316" opacity="0.18"/><text x="417" y="259" text-anchor="middle" font-weight="bold" fill="#f97316">20</text>
      <rect x="440" y="236" width="34" height="34" rx="8" fill="#f97316" opacity="0.18"/><text x="457" y="259" text-anchor="middle" font-weight="bold" fill="#f97316">21</text>
