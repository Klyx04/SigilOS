      <rect x="240" y="182" width="34" height="34" rx="8" fill="#a855f7" opacity="0.28"/><text x="257" y="205" text-anchor="middle" font-weight="bold" fill="#ffffff">★10</text>
      <rect x="280" y="182" width="34" height="34" rx="8" fill="#a855f7" opacity="0.18"/><text x="297" y="205" text-anchor="middle" font-weight="bold" fill="#a855f7">11</text>
      <rect x="320" y="182" width="34" height="34" rx="8" fill="#a855f7" opacity="0.18"/><text x="337" y="205" text-anchor="middle" font-weight="bold" fill="#a855f7">12</text>
