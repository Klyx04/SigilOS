  <text x="24" y="368" font-size="11" fill="#8b8b98">Chaque étage a son type de salle — Combat, Fontaine, Faveur ou Boss — et rapporte des points de Rêve.</text>
  <text x="24" y="388" font-size="11" fill="#8b8b98">Seul le meneur fait avancer l'étage courant depuis la fiche de la run.</text>
