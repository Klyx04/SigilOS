    <g>
      <rect x="240" y="290" width="34" height="34" rx="8" fill="#ef4444" opacity="0.28"/><text x="257" y="313" text-anchor="middle" font-weight="bold" fill="#ffffff">★22</text>
      <rect x="280" y="290" width="34" height="34" rx="8" fill="#ef4444" opacity="0.18"/><text x="297" y="313" text-anchor="middle" font-weight="bold" fill="#ef4444">23</text>
      <rect x="320" y="290" width="34" height="34" rx="8" fill="#ef4444" opacity="0.18"/><text x="337" y="313" text-anchor="middle" font-weight="bold" fill="#ef4444">24</text>
      <rect x="360" y="290" width="34" height="34" rx="8" fill="#ef4444" opacity="0.18"/><text x="377" y="313" text-anchor="middle" font-weight="bold" fill="#ef4444">25</text>
