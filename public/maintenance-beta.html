<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigilOS Beta — Maintenance</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
            overflow: hidden;
            background: #0a0a0f;
        }

        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 40%, rgba(245, 158, 11, 0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(20, 184, 166, 0.06) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a0f 0%, #111318 50%, #0a0a0f 100%);
        }

        /* Animated gear */
        .gear {
            position: fixed;
            opacity: 0.06;
            font-size: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: spin 30s linear infinite;
            pointer-events: none;
        }

        @keyframes spin {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .card {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 480px;
            padding: 44px 36px;
            background: rgba(15, 17, 24, 0.9);
            border: 1px solid rgba(245, 158, 11, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 60px rgba(245, 158, 11, 0.04), 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 12px;
            animation: wrench 3s ease-in-out infinite;
        }

        @keyframes wrench {

            0%,
            100% {
                transform: rotate(0deg);
            }

            20% {
                transform: rotate(-15deg);
            }

            40% {
                transform: rotate(10deg);
            }

            60% {
                transform: rotate(-5deg);
            }

            80% {
                transform: rotate(0deg);
            }
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #f59e0b;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.25);
            color: #fbbf24;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 4px 14px;
            border-radius: 999px;
            margin-bottom: 24px;
        }

        .divider {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.3), transparent);
            margin: 0 auto 20px;
        }

        .message {
            font-size: 0.95rem;
            line-height: 1.7;
            color: rgba(226, 232, 240, 0.65);
            margin-bottom: 24px;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, #f59e0b, #14b8a6);
            border-radius: 4px;
            animation: progress-anim 3s ease-in-out infinite;
        }

        @keyframes progress-anim {
            0% {
                width: 10%;
                opacity: 0.6;
            }

            50% {
                width: 70%;
                opacity: 1;
            }

            100% {
                width: 10%;
                opacity: 0.6;
            }
        }

        .lore {
            font-size: 0.75rem;
            font-style: italic;
            color: rgba(226, 232, 240, 0.25);
            line-height: 1.5;
        }

        .timer {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            color: rgba(20, 184, 166, 0.6);
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            .card {
                margin: 16px;
                padding: 28px 20px;
            }

            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg"></div>
    <div class="gear">⚙</div>

    <div class="card">
        <div class="icon">🔧</div>
        <h1>Maintenance en cours</h1>
        <div class="badge">Beta · Mise à jour</div>
        <div class="divider"></div>

        <p class="message">
            Les Sigils sont en cours de <strong style="color: #f59e0b">recalibration</strong>.<br>
            L'équipe déploie une nouvelle version. Ça ne prend que quelques minutes.
        </p>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <p class="timer">⏱ Retour imminent</p>

        <p class="lore">
            « Les arcanes du Krosmoz nécessitent parfois un réalignement.
            Les portes se rouvriront sous peu, aventurier. »
        </p>
    </div>
</body>

</html>
